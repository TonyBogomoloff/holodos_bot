[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "holodos-bot"
version = "0.1.0"
description = "Telegram fridge photos, voice corrections and source-verified recipes"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "Pillow==11.3.0", "jsonschema==4.25.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[project.scripts]
holodos-bot = "holodos_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
